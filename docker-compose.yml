version: '3'
services:
  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    user: root

  sonarqube:
    image: sonarqube:lts
    ports:
      - "9000:9000"

volumes:
  jenkins_home:
